<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bagels Restaurant</title>
<style>
html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#000; color:#fff; font-family:monospace; }
#backgroundContainer { position: fixed; inset:0; z-index:0; }
#menuOverlay {
    position: fixed; top:20px; right:20px; width:400px; max-height:90vh; overflow-y:auto;
    background: rgba(0,0,0,0.85); border:2px solid #6a0dad; border-radius:12px; padding:20px; z-index:10;
}
#menuOverlay img { display:block; margin:0 auto 10px; width:80px; border-radius:8px; }
#menuOverlay h2 { text-align:center; margin:0 0 10px; }
#menuOverlay label { display:block; margin-top:8px; }
#menuOverlay input, #menuOverlay select, #menuOverlay textarea, #menuOverlay button { width:100%; margin-top:4px; }
#menuOverlay ul { padding-left:20px; }
#canvasOverlay { position:fixed; inset:0; z-index:5; }
#ytIframe { position:absolute; z-index:6; display:none; pointer-events:none; border:none; }
video { display:none; }
</style>
</head>
<body>

<div id="backgroundContainer"></div>

<div id="menuOverlay">
    <img src="https://i.ibb.co/svCy4nGm/reisen-udongein-inaba-touhou-drawn-by-you-noanoamoemoe-sample-bdb364f8127f9917ab4506de79b3392d-re.png">
    <h2>Bagels Restaurant</h2>

    <ul>
        <li><a href="https://reisenbagels.tiddlyhost.com/" target="_blank">Hold My Glass Logs</a></li>
        <li><a href="http://discord.gg/SNRWuKwSbU" target="_blank">Hold My Glass Discord</a></li>
        <li><a href="https://discord.gg/PmQt6mK" target="_blank">Reisen Gang Discord</a></li>
        <li><a href="https://discord.gg/fumofumo" target="_blank">Fumo Discord</a></li>
    </ul>

    <label>Input Mode</label>
    <select id="mode">
        <option value="file" selected>Local Video</option>
        <option value="camera">Camera</option>
        <option value="url">Direct URL / YouTube</option>
    </select>

    <input type="file" id="file" accept="video/*">
    <input type="text" id="urlInput" placeholder="Direct video URL or YouTube link">

    <label>Layout</label>
    <select id="layout">
        <option value="mosaic">Mosaic</option>
        <option value="zoetrope">Zoetrope</option>
        <option value="radial">Radial</option>
    </select>

    <label>Tile Width</label>
    <input type="range" id="tileWidth" min="10" max="320" value="320">

    <label>Tile Height</label>
    <input type="range" id="tileHeight" min="10" max="240" value="240">

    <label>Speed (tiles/frame)</label>
    <input type="range" id="speed" min="1" max="60" value="60">

    <label>Direction</label>
    <select id="direction">
        <option value="top_right">Top Left → Right</option>
        <option value="top_left">Top Right → Left</option>
        <option value="bottom_right">Bottom Left → Right</option>
        <option value="bottom_left">Bottom Right → Left</option>
    </select>

    <label><input type="checkbox" id="disableStrobe"> Disable Strobe</label>
    <label><input type="checkbox" id="magicParticles"> Magic Particles</label>
    <label><input type="checkbox" id="mouseParticles"> Mouse Particles</label>

    <label id="radialLabel" style="display:none">Radial Size</label>
    <input type="range" id="radialSize" min="100" max="1200" value="400" style="display:none">

    <button id="play">PLAY</button>
</div>

<canvas id="canvasOverlay"></canvas>
<video id="video" playsinline crossorigin="anonymous"></video>
<iframe id="ytIframe" allow="autoplay; encrypted-media" allowfullscreen></iframe>

<!-- THREE.JS -->
<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>

<script>
// --- WEBGL SPLASH ---
class Splash {
    constructor(container){
        this.container = container;
        this.scene = new THREE.Scene();
        this.camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        this.renderer = new THREE.WebGLRenderer({alpha:true});
        this.renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(this.renderer.domElement);

        this.count = 2000;
        this.positions = new Float32Array(this.count*3);
        for(let i=0;i<this.count*3;i++) this.positions[i]=(Math.random()-0.5)*100;

        this.colors = new Float32Array(this.count*3);
        for(let i=0;i<this.count*3;i+=3){ this.colors[i]=170/255; this.colors[i+1]=0; this.colors[i+2]=220/255; }

        this.particles = new THREE.BufferGeometry();
        this.particles.setAttribute('position', new THREE.BufferAttribute(this.positions,3));
        this.particles.setAttribute('color', new THREE.BufferAttribute(this.colors,3));

        const material = new THREE.PointsMaterial({size:0.5, vertexColors:true});
        this.pointCloud = new THREE.Points(this.particles, material);
        this.scene.add(this.pointCloud);

        this.camera.position.z = 50;
        this.animate = true;
        this._loop();
    }
    _loop() {
        if(!this.animate) return;
        requestAnimationFrame(() => this._loop());

        const positions = this.particles.attributes.position.array;
        const colors = this.particles.attributes.color.array;
        const time = Date.now()*0.001;

        for(let i=0;i<positions.length;i+=3){
            const x = positions[i], z = positions[i+2];
            positions[i+1] = Math.sin(x*0.1+time)*10 + Math.cos(z*0.1+time)*5;
            positions[i] += 0.05; if(positions[i] > 50) positions[i] = -50;

            const hue = (Math.sin(x*0.05+time)+1)/2;
            colors[i] = (170 + hue*85)/255;
            colors[i+1] = (0 + hue*50)/255;
            colors[i+2] = (220 - hue*50)/255;
        }

        this.particles.attributes.position.needsUpdate = true;
        this.particles.attributes.color.needsUpdate = true;
        this.pointCloud.rotation.y += 0.002;
        this.renderer.render(this.scene, this.camera);
    }
    stop(){ this.animate=false; this.renderer.domElement.style.display='none'; }
}

let splash = new Splash(document.getElementById("backgroundContainer"));

// --- CANVAS VIDEO ---
const canvas = document.getElementById("canvasOverlay");
const ctx = canvas.getContext("2d");
canvas.width = innerWidth; canvas.height = innerHeight;
window.addEventListener("resize",()=>{canvas.width=innerWidth; canvas.height=innerHeight;});

const video = document.getElementById("video");
const ytIframe = document.getElementById("ytIframe");

// --- AUDIO ---
let audioCtx, analyser, data;
function setupAudio(){
    audioCtx = new AudioContext();
    const src = audioCtx.createMediaElementSource(video);
    analyser = audioCtx.createAnalyser();
    src.connect(analyser); analyser.connect(audioCtx.destination);
    analyser.fftSize = 256; data = new Uint8Array(analyser.frequencyBinCount);
}

// --- PARTICLES ---
let mouseParticles=[];
canvas.addEventListener('mousemove', e=>{ mouseParticles.push({x:e.clientX,y:e.clientY,life:60}); });

// --- TILE LOGIC ---
let tx=0,ty=0;
function nextTile(cols,rows,direction){
    if(direction.includes('right')) tx++; else tx--;
    if(tx>=cols){ tx=0; ty++; } if(tx<0){ tx=cols-1; ty++; }
    if(ty>=rows) ty=0;
    return {x:tx,y:ty};
}

// --- DRAW LOOP ---
function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    const tw=+document.getElementById("tileWidth").value;
    const th=+document.getElementById("tileHeight").value;
    const cols=Math.ceil(canvas.width/tw);
    const rows=Math.ceil(canvas.height/th);
    const speed=+document.getElementById("speed").value;
    const layout=document.getElementById("layout").value;
    const dir=document.getElementById("direction").value;
    const strobe=!document.getElementById("disableStrobe").checked;

    if(video.readyState>=2){
        analyser.getByteFrequencyData(data);
        const lvl=Math.max(...data)/255;
        for(let i=0;i<speed;i++){
            let t=nextTile(cols,rows,dir);
            let x=t.x*tw,y=t.y*th;
            if(layout==='mosaic') ctx.drawImage(video,x,y,tw,th);
            if(layout==='zoetrope'){
                const cx=canvas.width/2, cy=canvas.height/2;
                const angle=(t.x+t.y)*0.1;
                ctx.save(); ctx.translate(cx,cy); ctx.rotate(angle);
                ctx.drawImage(video,-tw/2,-th/2,tw,th); ctx.restore();
            }
            if(layout==='radial'){
                const cx=canvas.width/2, cy=canvas.height/2;
                const r=+document.getElementById("radialSize").value;
                const theta=(t.x+t.y)/(cols+rows)*Math.PI*2;
                const px=cx+Math.cos(theta)*r, py=cy+Math.sin(theta)*r;
                ctx.drawImage(video,px-tw/2,py-th/2,tw,th);
            }
        }

        if(strobe && lvl>0.8){ ctx.fillStyle='rgba(255,255,255,0.2)'; ctx.fillRect(0,0,canvas.width,canvas.height); }

        if(document.getElementById("magicParticles").checked){
            for(let i=0;i<50;i++){
                const px=Math.random()*canvas.width, py=Math.random()*canvas.height;
                const size=Math.random()*5+1;
                ctx.fillStyle=`rgba(255,105,180,${lvl})`;
                ctx.beginPath(); ctx.arc(px,py,size,0,Math.PI*2); ctx.fill();
            }
        }

        if(document.getElementById("mouseParticles").checked){
            mouseParticles.forEach(p=>{
                ctx.fillStyle=`rgba(0,255,255,0.5)`;
                ctx.beginPath(); ctx.arc(p.x,p.y,5,0,Math.PI*2); ctx.fill();
                p.life--;
            });
            mouseParticles = mouseParticles.filter(p=>p.life>0);
        }
    }
    requestAnimationFrame(draw);
}

// --- IFRAME TILE CONTROL ---
function drawIframeTile(){
    if(ytIframe.style.display==='none') return;

    const tw=+document.getElementById("tileWidth").value;
    const th=+document.getElementById("tileHeight").value;
    const layout=document.getElementById("layout").value;
    const cols=Math.ceil(canvas.width/tw);
    const rows=Math.ceil(canvas.height/th);
    const dir=document.getElementById("direction").value;

    let t = nextTile(cols,rows,dir);
    let x=0,y=0;

    if(layout==='mosaic'){ x = t.x*tw; y=t.y*th; }
    if(layout==='zoetrope'){
        const cx=canvas.width/2, cy=canvas.height/2;
        const angle=(t.x+t.y)*0.1;
        x = cx + Math.cos(angle)*200 - tw/2;
        y = cy + Math.sin(angle)*200 - th/2;
    }
    if(layout==='radial'){
        const cx=canvas.width/2, cy=canvas.height/2;
        const r=+document.getElementById("radialSize").value;
        const theta=(t.x+t.y)/(cols+rows)*Math.PI*2;
        x = cx + Math.cos(theta)*r - tw/2;
        y = cy + Math.sin(theta)*r - th/2;
    }

    ytIframe.style.left = x + "px";
    ytIframe.style.top = y + "px";
    ytIframe.style.width = tw + "px";
    ytIframe.style.height = th + "px";

    requestAnimationFrame(drawIframeTile);
}

// --- PLAY BUTTON ---
const play=document.getElementById("play");
const mode=document.getElementById("mode");
const file=document.getElementById("file");
const urlInput=document.getElementById("urlInput");
const layoutSel=document.getElementById("layout");
const radialLabel=document.getElementById("radialLabel");
const radialSize=document.getElementById("radialSize");

layoutSel.addEventListener("change",()=>{
    if(layoutSel.value==='radial'){ radialLabel.style.display='block'; radialSize.style.display='block'; }
    else { radialLabel.style.display='none'; radialSize.style.display='none'; }
});

function isYouTubeUrl(url){ return url.includes("youtube.com") || url.includes("youtu.be"); }
function getYouTubeID(url){
    if(url.includes("youtu.be")) return url.split("/").pop().split("?")[0];
    if(url.includes("youtube.com")) return new URL(url).searchParams.get("v");
    return null;
}

play.addEventListener("click", async()=>{
    splash.stop();
    ytIframe.style.display='none';
    video.src=""; video.srcObject=null;

    try{
        if(mode.value==='camera'){
            video.srcObject=await navigator.mediaDevices.getUserMedia({video:true,audio:true});
            await video.play(); video.muted=false; setupAudio(); await audioCtx.resume(); draw();
        }

        if(mode.value==='file'){
            if(!file.files[0]) return alert("Select a video file");
            video.src=URL.createObjectURL(file.files[0]);
            await video.play(); video.muted=false; setupAudio(); await audioCtx.resume(); draw();
        }

        if(mode.value==='url'){
            const url=urlInput.value.trim();
            if(!url) return alert("Enter a URL");

            if(isYouTubeUrl(url)){
                const videoId=getYouTubeID(url);
                if(!videoId) return alert("Invalid YouTube URL");
                ytIframe.src=`https://www.youtube.com/embed/${videoId}?autoplay=1&controls=0&modestbranding=1`;
                ytIframe.style.display='block';
                drawIframeTile();
            } else {
                video.src=url;
                await video.play(); video.muted=false; setupAudio(); await audioCtx.resume(); draw();
            }
        }
    }catch(e){ console.error(e); alert("Error: "+e.message);}
});
</script>
</body>
</html>
